[package]
name = "nest-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line host for Nest applications"

[dependencies]
async-trait = { version = "0.1", optional = true }
clap = { version = "4", features = ["derive", "env"] }
nest-app = { path = "../nest-app" }
nest-config = { path = "../nest-config" }
nest-core = { path = "../nest-core" }
nest-error = { path = "../nest-error", features = ["serde"] }
nest-logging = { path = "../nest-logging" }
nest-task-runtime = { path = "../nest-task-runtime", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"], optional = true }
tracing = "0.1"

[features]
default = []
async = ["dep:nest-task-runtime", "dep:async-trait", "dep:tokio"]

[dev-dependencies]
nest-file = { path = "../nest-file" }
nest-file-csv = { path = "../nest-file-csv" }
nest-app = { path = "../nest-app" }
tempfile = "3"
