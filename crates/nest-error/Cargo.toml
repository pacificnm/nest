[package]
name = "nest-error"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared error model for the Nest modular desktop application framework"

[dependencies]
thiserror = "2"

serde = { version = "1", features = ["derive"], optional = true }
miette = { version = "7", optional = true }

[features]
default = []
serde = ["dep:serde"]
diagnostics = ["dep:miette"]

[dev-dependencies]
serde_json = "1"
