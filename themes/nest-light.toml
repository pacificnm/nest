id = "nest-light"
mode = "light"

[colors]
background = "#FFFFFF"
foreground = "#1A1A1A"
primary = "#2563EB"
secondary = "#64748B"
border = "#E2E8F0"
surface = "#F8FAFC"
accent = "#7C3AED"
muted = "#94A3B8"

[spacing]
xs = 4.0
sm = 8.0
md = 16.0
lg = 24.0
xl = 32.0
xxl = 48.0

[radius]
sm = 4.0
md = 8.0
lg = 12.0
full = 9999.0

[typography.body]
font_family = "Inter"
size = 14.0
line_height = 20.0
weight = 400

[typography.heading]
font_family = "Inter"
size = 20.0
line_height = 28.0
weight = 600

[typography.caption]
font_family = "Inter"
size = 12.0
line_height = 16.0
weight = 400

[typography.mono]
font_family = "JetBrains Mono"
size = 13.0
line_height = 18.0
weight = 400

[status]
success = "#16A34A"
warning = "#D97706"
error = "#DC2626"
info = "#2563EB"
