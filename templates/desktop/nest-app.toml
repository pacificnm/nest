# Nest Shell manifest — copy into your product repo root.
# Nest Shell scans `apps/<name>/nest-app.toml` and shows registered apps on the desktop.

[shell]
name = "My App"
category = "Development"
icon = "fa-solid fa-cube"
description = "Short description shown when the app opens in Nest Shell."
# visible = true

# Launch mode: embed (shell child webview), spawn (external binary), module (built-in placeholder)
[shell.launch]
mode = "embed"
# program = "my-app-desktop"   # for spawn mode

# Dev server port when embedded in Nest Shell (orchestrator assigns if omitted)
[shell.dev]
# port = 5174

# Built UI entry for production embed launches
[shell.build]
entry = "ui/dist/index.html"
