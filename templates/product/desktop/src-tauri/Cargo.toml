[package]
name = "{{app_id}}"
version = "0.1.0"
description = "{{display_title}} desktop app (Tauri + React)"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
{{app_id}}-core = { path = "../../crates/core" }
nest-cache = { workspace = true }
nest-cache-file = { workspace = true }
nest-image = { workspace = true }
nest-tauri = { workspace = true, features = ["runtime", "images"] }
nest-theme = { workspace = true }
tauri = { workspace = true }
