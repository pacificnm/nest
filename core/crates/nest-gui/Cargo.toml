[package]
name = "nest-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop GUI host for Nest applications (eframe/egui)"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
nest-app = { workspace = true  }
nest-config = { workspace = true  }
nest-core = { workspace = true  }
nest-error = { workspace = true, features = ["serde"]  }
nest-logging = { workspace = true  }
nest-theme = { workspace = true  }
nest-task-runtime = { workspace = true, optional = true  }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"], optional = true }
tracing = "0.1"

[features]
default = []
async = ["dep:nest-task-runtime", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
