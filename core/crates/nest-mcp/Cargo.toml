[package]
name = "nest-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio client for the Nest framework"

[dependencies]
nest-error = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros", "rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros", "rt-multi-thread"] }
