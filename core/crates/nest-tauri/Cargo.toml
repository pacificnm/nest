[package]
name = "nest-tauri"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop host for Nest applications (Tauri + React webview)"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
nest-app = { workspace = true }
nest-config = { workspace = true }
nest-core = { workspace = true }
nest-design = { workspace = true }
nest-error = { workspace = true, features = ["serde"] }
nest-logging = { workspace = true }
nest-image = { workspace = true, optional = true }
nest-react-theme = { workspace = true }
nest-task-runtime = { workspace = true, optional = true }
nest-theme = { workspace = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
tracing = "0.1"

[features]
default = []
async = ["dep:nest-task-runtime", "dep:tokio"]
runtime = ["dep:tauri"]
images = ["dep:nest-image", "dep:base64"]

[dev-dependencies]
nest-cache = { workspace = true }
tempfile = "3"
