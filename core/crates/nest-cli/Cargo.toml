[package]
name = "nest-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line host for Nest applications"

[dependencies]
async-trait = { version = "0.1", optional = true }
clap = { version = "4", features = ["derive", "env"] }
nest-app = { workspace = true  }
nest-config = { workspace = true  }
nest-core = { workspace = true  }
nest-error = { workspace = true, features = ["serde"]  }
nest-logging = { workspace = true  }
nest-task-runtime = { workspace = true, optional = true  }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"], optional = true }
tracing = "0.1"

[features]
default = []
async = ["dep:nest-task-runtime", "dep:async-trait", "dep:tokio"]

[dev-dependencies]
nest-file = { workspace = true  }
nest-file-csv = { workspace = true  }
nest-app = { workspace = true  }
tempfile = "3"
