[package]
name = "nest-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal UI host for Nest applications (Ratatui)"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
nest-app = { workspace = true  }
nest-config = { workspace = true  }
nest-core = { workspace = true  }
nest-error = { workspace = true, features = ["serde"]  }
nest-logging = { workspace = true  }
nest-task-runtime = { workspace = true, optional = true  }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"], optional = true }
tracing = "0.1"

[features]
default = []
async = ["dep:nest-task-runtime", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
