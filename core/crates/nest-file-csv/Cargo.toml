[package]
name = "nest-file-csv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CSV import/export for the Nest framework"

[dependencies]
csv = "1"
nest-core = { workspace = true  }
nest-error = { workspace = true  }
nest-file = { workspace = true  }
nest-validation = { workspace = true, optional = true  }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[features]
default = []
validate = ["dep:nest-validation"]

[dev-dependencies]
nest-file = { workspace = true  }
nest-validation = { workspace = true  }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[package.metadata.cargo-all-features]
# tests enable validate via `cargo test -p nest-file-csv --features validate`
