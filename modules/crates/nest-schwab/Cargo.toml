[package]
name = "nest-schwab"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Charles Schwab Trader API client module for the Nest framework"

[dependencies]
nest-auth = { workspace = true }
nest-auth-oauth-client = { workspace = true }
nest-core = { workspace = true }
nest-error = { workspace = true }
nest-http = { workspace = true, features = ["serde"] }
nest-http-client = { workspace = true }
nest-config = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[features]
default = ["config"]
config = ["dep:nest-config"]

[dev-dependencies]
nest-config = { workspace = true }
nest-core = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
