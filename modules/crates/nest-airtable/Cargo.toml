[package]
name = "nest-airtable"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Airtable REST API client for the Nest framework"

[dependencies]
nest-config = { workspace = true  }
nest-core = { workspace = true  }
nest-error = { workspace = true  }
nest-http = { workspace = true, features = ["serde"]  }
nest-http-client = { workspace = true  }
nest-task = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
nest-config = { workspace = true  }
nest-core = { workspace = true  }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
