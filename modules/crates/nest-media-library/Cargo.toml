[package]
name = "nest-media-library"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Media library scanning and indexing for the Nest framework"

[dependencies]
nest-core = { workspace = true }
nest-error = { workspace = true }
nest-file = { workspace = true }
nest-media = { workspace = true, features = ["async", "serde"] }
nest-task = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
nest-core = { workspace = true }
nest-file = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
