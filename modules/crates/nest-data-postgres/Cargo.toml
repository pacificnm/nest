[package]
name = "nest-data-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL provider for the Nest data layer with pgvector support"

[dependencies]
async-trait = "0.1"
nest-core = { workspace = true }
nest-data = { workspace = true, features = ["async"] }
nest-error = { workspace = true }
pgvector = { version = "0.4", features = ["sqlx"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
nest-data = { workspace = true, features = ["async"] }
testcontainers-modules = { version = "=0.11.6", features = ["postgres", "blocking"] }
uuid = { version = "1", features = ["v4"] }
